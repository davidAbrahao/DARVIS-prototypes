[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "darvis-api"
version = "0.2.0"
description = "API do sistema de inteligência pessoal D.A.R.V.I.S."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.137.2,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "email-validator>=2.2,<3.0",
  "sqlalchemy>=2.0.38,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "PyJWT>=2.10,<3.0",
  "google-genai>=3.5,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
