name: Verificações da API D.A.R.V.I.S.

on:
  push:
    branches:
      - product/foundation-v0.1
    paths:
      - "08-darvis-product/apps/api/**"
      - ".github/workflows/darvis-api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualidade:
    name: Testes e análise estática
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: darvis_test
          POSTGRES_USER: darvis
          POSTGRES_PASSWORD: darvis-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darvis -d darvis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://darvis:darvis-ci-only@localhost:5432/darvis_test
      TEST_DATABASE_URL: postgresql+psycopg://darvis:darvis-ci-only@localhost:5432/darvis_test
      SECRET_KEY: darvis-ci-only-signing-secret-change-before-any-real-use
      INITIAL_SETUP_TOKEN: darvis-ci-only-initial-setup-secret-change-before-real-use
      CORS_ORIGINS: '["http://localhost:3000"]'
    defaults:
      run:
        working-directory: 08-darvis-product/apps/api
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 08-darvis-product/apps/api/pyproject.toml

      - name: Instalar API e ferramentas de desenvolvimento
        run: python -m pip install -e ".[dev]"

      - name: Aplicar migrações no PostgreSQL efêmero
        run: alembic upgrade head

      - name: Executar testes
        run: pytest -q

      - name: Verificar qualidade do código
        run: ruff check .
