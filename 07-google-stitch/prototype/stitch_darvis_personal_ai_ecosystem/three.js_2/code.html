  icon?: LucideIcon;
  loading?: boolean;
}

export const HudButton: React.FC<HudButtonProps> = ({
  children,
  variant = 'primary',
  size = 'md',
  icon: Icon,
  loading = false,
  className = '',
  ...props
}) => {
  const baseStyles =
    'relative inline-flex items-center justify-center font-mono uppercase tracking-wider font-semibold transition-all duration-150 focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed select-none active:scale-[0.98]';

  const sizeStyles = {
    sm: 'text-xs px-3 py-1.5 rounded gap-1.5',
    md: 'text-sm px-4 py-2.5 rounded-lg gap-2',
    lg: 'text-base px-6 py-3 rounded-lg gap-2.5',
  };

  const variantStyles = {
    primary:
      'bg-hud-cyan text-surface-lowest hover:bg-hud-cyan-bright hover:shadow-hud-glow border border-hud-cyan',
    secondary:
      'bg-surface-high/80 text-hud-cyan border border-hud-border hover:border-hud-cyan hover:bg-surface-container hover:shadow-hud-glow',
    danger:
      'bg-hud-rose/20 text-hud-rose border border-hud-rose/40 hover:bg-hud-rose hover:text-white',
    ghost:
      'bg-transparent text-slate-400 hover:text-hud-cyan hover:bg-surface-low border border-transparent hover:border-hud-border',
  };

  return (
    <button
      className={`${baseStyles} ${sizeStyles[size]} ${variantStyles[variant]} ${className}`}
      {...props}
    >
      {loading ? (
        <span className="w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin" />
      ) : Icon ? (
        <Icon className="w-4 h-4 shrink-0" />
      ) : null}
      <span>{children}</span>
    </button>
  );
};

### 4.2. Voice Input Hook (`/hooks/usePushToTalk.ts`)

```typescript
import { useState, useEffect, useCallback, useRef } from 'react';

interface UsePushToTalkOptions {
  onTranscriptComplete: (transcript: string) => void;
  onAudioBufferChange?: (volume: number) => void;
}

export const usePushToTalk = ({
  onTranscriptComplete,
  onAudioBufferChange,
}: UsePushToTalkOptions) => {
  const [isRecording, setIsRecording] = useState(false);
  const [transcript, setTranscript] = useState('');
  const recognitionRef = useRef<any>(null);

  useEffect(() => {
    const SpeechRecognition =
      (window as any).SpeechRecognition || (window as any).webkitSpeechRecognition;

    if (!SpeechRecognition) return;

    const recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'pt-BR';

    recognition.onresult = (event: any) => {
      let currentText = '';
      for (let i = event.resultIndex; i < event.results.length; ++i) {
        currentText += event.results[i][0].transcript;
      }
      setTranscript(currentText);
    };

    recognitionRef.current = recognition;
  }, []);

  const startRecording = useCallback(() => {
    if (isRecording || !recognitionRef.current) return;
    setTranscript('');
    setIsRecording(true);
    recognitionRef.current.start();
  }, [isRecording]);

  const stopRecording = useCallback(() => {
    if (!isRecording || !recognitionRef.current) return;
    setIsRecording(false);
    recognitionRef.current.stop();
    if (transcript.trim()) {
      onTranscriptComplete(transcript);
    }
  }, [isRecording, transcript, onTranscriptComplete]);

  // Space bar hold listener
  useEffect(() => {
    const handleKeyDown = (e: KeyboardEvent) => {
      if (e.code === 'Space' && !e.repeat && document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'TEXTAREA') {
        e.preventDefault();
        startRecording();
      }
    };

    const handleKeyUp = (e: KeyboardEvent) => {
      if (e.code === 'Space' && document.activeElement?.tagName !== 'INPUT' && document.activeElement?.tagName !== 'TEXTAREA') {
        e.preventDefault();
        stopRecording();
      }
    };

    window.addEventListener('keydown', handleKeyDown);
    window.addEventListener('keyup', handleKeyUp);
    return () => {
      window.removeEventListener('keydown', handleKeyDown);
      window.removeEventListener('keyup', handleKeyUp);
    };
  }, [startRecording, stopRecording]);

  return { isRecording, transcript, startRecording, stopRecording };
};
```
