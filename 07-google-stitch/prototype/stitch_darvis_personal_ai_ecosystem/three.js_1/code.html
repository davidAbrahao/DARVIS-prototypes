<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_51 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_51" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_51');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || 450;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
camera.position.set(0, 0, 18);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const brainGroup = new THREE.Group();
scene.add(brainGroup);

// Generate 3D point cloud and graph in the silhouette/form of a human brain with two hemispheres
const nodeCount = 180;
const nodes = [];
const nodePositions = [];
const colors = [];

const colorCyan = new THREE.Color('#38bdf8');
const colorEmerald = new THREE.Color('#56e5a9');
const colorPurple = new THREE.Color('#a855f7');
const colorAmber = new THREE.Color('#f59e0b');

for (let i = 0; i < nodeCount; i++) {
  const side = Math.random() > 0.5 ? 1 : -1;
  const u = Math.random();
  const v = Math.random();
  const theta = u * Math.PI * 2;
  const phi = Math.acos(2 * v - 1);
  
  // Ellipsoidal brain lobes formula
  let r = 4.8 + Math.sin(theta * 3) * 0.7 + Math.cos(phi * 2) * 0.5;
  let x = side * (1.2 + Math.abs(r * Math.sin(phi) * Math.cos(theta) * 0.85));
  let y = r * Math.sin(phi) * Math.sin(theta) * 0.75 + (Math.sin(theta) * 0.5);
  let z = r * Math.cos(phi) * 1.15;
  
  // Indentation between hemispheres (longitudinal fissure)
  if (Math.abs(x) < 1.0) {
    x = side * (0.9 + Math.random() * 0.4);
  }
  
  // Cerebellum bulge at lower posterior
  if (z < -1.5 && y < -1.0) {
    y += Math.sin(x) * 0.5;
    r += 0.6;
  }

  nodePositions.push(new THREE.Vector3(x, y, z));
  
  // Categorical coloring for Obsidian neural themes
  let c = colorCyan;
  const randType = Math.random();
  if (randType > 0.75) c = colorEmerald;
  else if (randType > 0.55) c = colorPurple;
  else if (randType > 0.45) c = colorAmber;
  
  colors.push(c);
}

// Glowing spheres for nodes
const sphereGeo = new THREE.SphereGeometry(0.14, 12, 12);
const coreSphereGeo = new THREE.SphereGeometry(0.25, 14, 14);

nodePositions.forEach((pos, idx) => {
  const isMajorHub = idx % 12 === 0;
  const mat = new THREE.MeshBasicMaterial({
    color: colors[idx],
    transparent: true,
    opacity: isMajorHub ? 0.95 : 0.75
  });
  const mesh = new THREE.Mesh(isMajorHub ? coreSphereGeo : sphereGeo, mat);
  mesh.position.copy(pos);
  brainGroup.add(mesh);
  nodes.push({ mesh, originalPos: pos.clone(), phase: Math.random() * Math.PI * 2, isHub: isMajorHub });
});

// Construct synaptic edges between nearby nodes
const lineMat = new THREE.LineBasicMaterial({
  color: 0x38bdf8,
  transparent: true,
  opacity: 0.22,
  blending: THREE.AdditiveBlending
});

const edgePositions = [];
for (let i = 0; i < nodeCount; i++) {
  let connections = 0;
  for (let j = i + 1; j < nodeCount; j++) {
    const dist = nodePositions[i].distanceTo(nodePositions[j]);
    if (dist < 2.3 && connections < 4) {
      edgePositions.push(
        nodePositions[i].x, nodePositions[i].y, nodePositions[i].z,
        nodePositions[j].x, nodePositions[j].y, nodePositions[j].z
      );
      connections++;
    }
  }
}

const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(edgePositions, 3));
const lines = new THREE.LineSegments(lineGeo, lineMat);
brainGroup.add(lines);

// Ambient pulse point light in the core
const centerLight = new THREE.PointLight(0x38bdf8, 2, 25);
centerLight.position.set(0, 0, 0);
brainGroup.add(centerLight);

// Interactive mouse rotation
let mouseX = 0, mouseY = 0;
let targetRotX = 0.2, targetRotY = 0;

window.addEventListener('mousemove', (e) => {
  const rect = container.getBoundingClientRect();
  mouseX = ((e.clientX - rect.left) / (rect.width || 1)) * 2 - 1;
  mouseY = -(((e.clientY - rect.top) / (rect.height || 1)) * 2 - 1);
  targetRotY = mouseX * 0.8;
  targetRotX = 0.2 - mouseY * 0.5;
});

// Touch controls for mobile
window.addEventListener('touchmove', (e) => {
  if (e.touches.length > 0) {
    const touch = e.touches[0];
    const rect = container.getBoundingClientRect();
    mouseX = ((touch.clientX - rect.left) / (rect.width || 1)) * 2 - 1;
    targetRotY = mouseX * 1.2;
  }
}, { passive: true });

window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || 450;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  // Subtle breathing / pulsating of the neural brain
  brainGroup.rotation.y += 0.004;
  brainGroup.rotation.x += (targetRotX - brainGroup.rotation.x) * 0.05;
  brainGroup.rotation.y += (targetRotY - (brainGroup.rotation.y % (Math.PI * 2))) * 0.03;

  // Synaptic pulse on hub nodes
  nodes.forEach((node) => {
    if (node.isHub) {
      const scale = 1.0 + Math.sin(time * 3 + node.phase) * 0.35;
      node.mesh.scale.set(scale, scale, scale);
    }
  });

  lineMat.opacity = 0.18 + Math.sin(time * 2.0) * 0.08;

  renderer.render(scene, camera);
}
animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_51 -->
</body>
</html>
